# nginx.conf principal para rodar como não-root + readOnlyRootFilesystem.
# Todos os caminhos escritos em runtime apontam para tmpfs (/tmp, /var/run, /var/cache).

worker_processes auto;
# PID em /tmp pois rodamos como user não-root e o fs raiz pode ser read-only.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    # Paths temporários (precisam ser writable mesmo com fs read-only)
    client_body_temp_path /tmp/client_body 1 2;
    proxy_temp_path       /tmp/proxy       1 2;
    fastcgi_temp_path     /tmp/fastcgi     1 2;
    uwsgi_temp_path       /tmp/uwsgi       1 2;
    scgi_temp_path        /tmp/scgi        1 2;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Config gerada pelo entrypoint (envsubst) vai pra cá
    include /tmp/nginx-conf.d/*.conf;
}
